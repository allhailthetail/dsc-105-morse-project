[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morse"
version = "0.1.0"
description = "Synthetic CW (Morse code) audio generation and signal-processing pipeline for a future CRNN+CTC decoder"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
